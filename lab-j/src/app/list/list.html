<div id="frame">
  <div>List component</div>
  <div>
    <input type="text" [(ngModel)]="inputText" placeholder="Enter text" />
    <button (click)="inputToArray()">Dodaj</button>
  </div>

  <ul>

    <li *ngFor="let el of elements; let i = index">
      {{ el }}
      <a href="#" (click)="remove(i)">usuń</a>
    </li>
  </ul>
</div>
